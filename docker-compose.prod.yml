# Production stack for Coolify — ONE Docker Compose resource, repo-root file.
#
# Images are built by GitHub Actions (.github/workflows/build-images.yml) and
# pulled from GHCR, so the VPS never builds anything. Postgres, Redis, EMQX
# and the three Tokinomo images all live in this one project, so service names
# (postgres, redis, emqx, api, web) resolve between containers and
# emqx/emqx.container.conf can keep calling http://api:3000.
#
# Setup runbook: team/COOLIFY_DEPLOY.md. Variables to fill in: .env.prod.example
#
# Coolify specifics (verify in the UI on first deploy):
#  - In the resource's General tab enable "Preserve repository during
#    deployment" — the EMQX config below is bind-mounted from the repo.
#  - Assign DOMAINS to services in the Coolify UI (no Traefik labels needed):
#       api -> https://<API_DOMAIN>:3000        web -> https://<APP_DOMAIN>:3001
#  - SERVICE_PASSWORD_64_* are Coolify "magic variables": Coolify generates a
#    stable random secret per name, shared by every service that references it.
#  - Don't publish host ports for api/web (it would bypass the proxy). The two
#    127.0.0.1 ports below are loopback-only, reachable via an SSH tunnel.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: tokinomo
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: tokinomo
    volumes:
      - tokinomo_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # admin access via `ssh -L 5432:127.0.0.1:5432 <server>`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokinomo -d tokinomo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_64_REDIS}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - tokinomo_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx/emqx:5.8.6
    restart: unless-stopped
    logging: *logging
    environment:
      EMQX_NAME: tokinomo
      # Environment variables override emqx.container.conf, so the committed
      # dev cookie / default dashboard password are never what runs in prod.
      EMQX_NODE__COOKIE: ${SERVICE_PASSWORD_64_EMQXCOOKIE}
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${SERVICE_PASSWORD_64_EMQXDASHBOARD}
    volumes:
      - tokinomo_emqx_data:/opt/emqx/data
      - ./tokinomo-backend/emqx/emqx.container.conf:/opt/emqx/etc/emqx.conf:ro
    ports:
      - "127.0.0.1:18083:18083" # dashboard via `ssh -L 18083:127.0.0.1:18083 <server>`
    labels:
      # MQTT over TLS for devices: Traefik terminates TLS on its `mqtts`
      # entrypoint (port 8883 — add it to Coolify's proxy config, see
      # team/COOLIFY_DEPLOY.md) and forwards plain MQTT to EMQX on 1883.
      - traefik.enable=true
      - traefik.tcp.routers.tokinomo-mqtts.rule=HostSNI(`${MQTT_DOMAIN:?set MQTT_DOMAIN, e.g. mqtt.example.com}`)
      - traefik.tcp.routers.tokinomo-mqtts.entrypoints=mqtts
      - traefik.tcp.routers.tokinomo-mqtts.tls=true
      - traefik.tcp.routers.tokinomo-mqtts.tls.certresolver=letsencrypt
      - traefik.tcp.services.tokinomo-mqtts.loadbalancer.server.port=1883
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/manavkhadka0/tokinomo}-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: https://${API_DOMAIN:?set API_DOMAIN, e.g. api.example.com}
      FRONTEND_URL: https://${APP_DOMAIN:?set APP_DOMAIN, e.g. app.example.com}
      CORS_ORIGINS: https://${APP_DOMAIN}
      BETTER_AUTH_URL: https://${APP_DOMAIN}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      # Parent domain with a leading dot (e.g. .example.com): the session cookie
      # is set via app.<domain> but must also reach api.<domain> for the
      # realtime websocket. Without it live dashboards never update.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?set COOKIE_DOMAIN to the parent domain with a leading dot, e.g. .example.com}
      DATABASE_URL: postgresql://tokinomo:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/tokinomo?schema=public
      REDIS_URL: redis://:${SERVICE_PASSWORD_64_REDIS}@redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT (R2 example https://<account>.r2.cloudflarestorage.com)}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT (for R2 the same value as S3_ENDPOINT)}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-tokinomo}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MQTT_URL: mqtt://emqx:1883
      MQTT_USERNAME: tokinomo-backend
      MQTT_PASSWORD: ${SERVICE_PASSWORD_64_MQTT}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?set RESEND_FROM_EMAIL, e.g. Tokinomo <noreply@example.com>}
      LEADS_EMAIL: ${LEADS_EMAIL:?set LEADS_EMAIL (where demo requests are sent)}
      # Used only by the one-time seed (node_modules/.bin/tsx prisma/seed-platform.ts).
      PLATFORM_EMAIL: ${PLATFORM_EMAIL:?set PLATFORM_EMAIL}
      PLATFORM_PASSWORD: ${PLATFORM_PASSWORD:?set PLATFORM_PASSWORD}
      PLATFORM_NAME: ${PLATFORM_NAME:-Platform Owner}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    # NEXT_PUBLIC_APP_URL / NEXT_PUBLIC_API_URL are baked into this image when
    # GitHub Actions builds it (repository variables) — a domain change needs a rebuild.
    image: ${IMAGE_PREFIX:-ghcr.io/manavkhadka0/tokinomo}-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backup:
    image: ${IMAGE_PREFIX:-ghcr.io/manavkhadka0/tokinomo}-backup:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    logging: *logging
    depends_on:
      # api healthy => migrations have run, so the first dump contains the schema.
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tokinomo:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/tokinomo
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-tokinomo}
      BACKUP_PREFIX: backups
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}

volumes:
  tokinomo_pg_data:
  tokinomo_redis_data:
  tokinomo_emqx_data:
