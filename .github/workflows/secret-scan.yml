# Scans the full git history for secrets on every push and pull request using
# .gitleaks.toml (provider tokens + the firmware / config-password rules).
# Fails the run — and so shows a red X — if anything is found. Complements the
# local pre-commit hook (.githooks/) and GitHub's own secret scanning.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # whole history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
