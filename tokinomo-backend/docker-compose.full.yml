# Production-image rehearsal: runs the real api + web Dockerfiles next to the
# infra in docker-compose.yml, so Dockerfile / env / networking bugs show up
# locally instead of on the host.
#
#   HOST_IP=<this machine's LAN IP> \
#     docker compose -f docker-compose.yml -f docker-compose.full.yml up -d --build
#
# HOST_IP is used for NEXT_PUBLIC_API_URL (the browser AND the web container
# must both reach the API, so localhost won't do) and for the presigned-URL
# host (devices must reach MinIO). Secrets (MQTT_PASSWORD, BETTER_AUTH_SECRET,
# RESEND_*) come from .env; the URLs below override its localhost values.
#
# EMQX only reads its auth URLs on the FIRST boot of its data volume, so this
# file gives EMQX its own volume (tokinomo_emqx_data_full) instead of reusing
# the one created under emqx.conf — switching between modes needs no manual
# wipe. Likewise the api uses its own database, tokinomo_full, so it boots
# against an EMPTY database exactly like a first deploy (migrations run via
# scripts/start.sh). Create it once on the shared Postgres:
#   docker exec tokinomo-postgres psql -U tokinomo -d postgres -c 'CREATE DATABASE tokinomo_full'

services:
  emqx:
    volumes:
      - tokinomo_emqx_data_full:/opt/emqx/data
      - ./emqx/emqx.container.conf:/opt/emqx/etc/emqx.conf:ro

  api:
    build:
      context: .
    container_name: tokinomo-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      emqx:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      APP_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3001
      CORS_ORIGINS: http://localhost:3001
      DATABASE_URL: postgresql://tokinomo:***REMOVED***@postgres:5432/tokinomo_full?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://${HOST_IP:?set HOST_IP to this machine's LAN IP}:9000
      MQTT_URL: mqtt://emqx:1883
      BETTER_AUTH_URL: http://localhost:3001
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: ../tokinomo-frontend
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3001
        NEXT_PUBLIC_API_URL: http://${HOST_IP:?set HOST_IP to this machine's LAN IP}:3000
    container_name: tokinomo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3001:3001'

volumes:
  tokinomo_emqx_data_full:
