## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  # main.c on this branch (Feature 1) doesn't call filesystem/mqtt_ctl at
  # all, but ESP-IDF's build still resolves every discovered component's
  # CMakeLists.txt at configure time (not just main's REQUIRES closure) —
  # components/filesystem and components/mqtt_ctl hard-require these by
  # name, so they still need to be fetched even though nothing links them
  # into this branch's actual binary. Learned this the hard way: leaving
  # them out fails idf.py set-target with "Failed to resolve component
  # 'joltwallet__littlefs' required by component 'filesystem'".
  joltwallet/littlefs: ^1.20.2
  espressif/mqtt: '*'
