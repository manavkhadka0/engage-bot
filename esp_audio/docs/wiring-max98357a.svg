<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Wiring diagram: FireBeetle 2 ESP32-UE (N16R2) connected to a MAX98357A I2S amplifier and speaker. BCLK on GPIO26/D3, LRC on GPIO25/D2, DIN on GPIO17/D10, VIN and SD tied together to 3.3V, GND to GND.">
  <rect x="0" y="0" width="960" height="660" fill="#fbf8f3"/>

  <!-- Title -->
  <text x="30" y="36" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#15202b">
    MAX98357A wiring — FireBeetle 2 ESP32-UE (N16R2)
  </text>
  <text x="30" y="58" font-family="ui-monospace, monospace" font-size="13" fill="#5b6672">
    esp_audio/components/aud_player/aud_player.c — I2S_BCLK_PIN / I2S_WS_PIN / I2S_DOUT_PIN
  </text>

  <!-- Legend -->
  <g font-family="ui-monospace, monospace" font-size="12" fill="#15202b">
    <line x1="700" y1="28" x2="730" y2="28" stroke="#c0392b" stroke-width="3"/>
    <text x="738" y="32">3.3V power</text>
    <line x1="700" y1="48" x2="730" y2="48" stroke="#2b2f36" stroke-width="3"/>
    <text x="738" y="52">GND</text>
    <line x1="830" y1="28" x2="860" y2="28" stroke="#1f6feb" stroke-width="3"/>
    <text x="868" y="32">I2S clocks</text>
    <line x1="830" y1="48" x2="860" y2="48" stroke="#8a4bd6" stroke-width="3"/>
    <text x="868" y="52">I2S data</text>
  </g>

  <!-- ESP32 board -->
  <rect x="60" y="110" width="260" height="400" rx="10" fill="#ffffff" stroke="#15202b" stroke-width="2"/>
  <text x="190" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#15202b">
    FireBeetle 2
  </text>
  <text x="190" y="158" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5b6672">
    ESP32-UE (N16R2)
  </text>

  <!-- ESP32 pins (right edge, x=320) -->
  <!-- 3V3 y=210 -->
  <circle cx="320" cy="210" r="4" fill="#c0392b"/>
  <text x="308" y="205" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">3V3</text>
  <!-- GND y=270 -->
  <circle cx="320" cy="270" r="4" fill="#2b2f36"/>
  <text x="308" y="265" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">GND</text>
  <!-- D3 / GPIO26 (BCLK) y=330 -->
  <circle cx="320" cy="330" r="4" fill="#1f6feb"/>
  <text x="308" y="325" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">D3 (GPIO26)</text>
  <!-- D2 / GPIO25 (LRC) y=390 -->
  <circle cx="320" cy="390" r="4" fill="#1f6feb"/>
  <text x="308" y="385" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">D2 (GPIO25)</text>
  <!-- D10 / GPIO17 (DIN) y=450 -->
  <circle cx="320" cy="450" r="4" fill="#8a4bd6"/>
  <text x="308" y="445" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">D10 (GPIO17)</text>

  <!-- MAX98357A board -->
  <rect x="560" y="150" width="220" height="320" rx="10" fill="#ffffff" stroke="#15202b" stroke-width="2"/>
  <text x="670" y="180" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#15202b">
    MAX98357A
  </text>
  <text x="670" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5b6672">
    I2S class-D amp
  </text>

  <!-- MAX98357A pins (left edge, x=560) -->
  <circle cx="560" cy="230" r="4" fill="#c0392b"/>
  <text x="572" y="225" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">VIN</text>
  <circle cx="560" cy="270" r="4" fill="#c0392b"/>
  <text x="572" y="265" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">SD</text>
  <circle cx="560" cy="310" r="4" fill="#2b2f36"/>
  <text x="572" y="305" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">GND</text>
  <circle cx="560" cy="350" r="4" fill="#1f6feb"/>
  <text x="572" y="345" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">BCLK</text>
  <circle cx="560" cy="390" r="4" fill="#1f6feb"/>
  <text x="572" y="385" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">LRC</text>
  <circle cx="560" cy="430" r="4" fill="#8a4bd6"/>
  <text x="572" y="425" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">DIN</text>

  <!-- MAX98357A speaker output pins (right edge, x=780) -->
  <circle cx="780" cy="250" r="4" fill="#2b2f36"/>
  <text x="768" y="245" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">+</text>
  <circle cx="780" cy="350" r="4" fill="#2b2f36"/>
  <text x="768" y="345" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#15202b">−</text>

  <!-- Speaker -->
  <rect x="860" y="260" width="70" height="80" rx="6" fill="#ffffff" stroke="#15202b" stroke-width="2"/>
  <circle cx="895" cy="300" r="26" fill="none" stroke="#15202b" stroke-width="2"/>
  <circle cx="895" cy="300" r="10" fill="#15202b"/>
  <text x="895" y="358" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#5b6672">
    Speaker 4–8Ω
  </text>

  <!-- Wires: ESP32 -> MAX98357A -->
  <!-- 3V3 splits to VIN and SD -->
  <path d="M 320 210 L 460 210 L 460 230 L 560 230" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M 460 210 L 460 270 L 560 270" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="460" cy="210" r="3.5" fill="#c0392b"/>

  <!-- GND -->
  <path d="M 320 270 L 480 270 L 480 310 L 560 310" fill="none" stroke="#2b2f36" stroke-width="2.5"/>

  <!-- BCLK -->
  <path d="M 320 330 L 500 330 L 500 350 L 560 350" fill="none" stroke="#1f6feb" stroke-width="2.5"/>

  <!-- LRC -->
  <path d="M 320 390 L 520 390 L 520 390 L 560 390" fill="none" stroke="#1f6feb" stroke-width="2.5"/>

  <!-- DIN -->
  <path d="M 320 450 L 540 450 L 540 430 L 560 430" fill="none" stroke="#8a4bd6" stroke-width="2.5"/>

  <!-- MAX98357A -> Speaker -->
  <path d="M 780 250 L 860 285" fill="none" stroke="#2b2f36" stroke-width="2"/>
  <path d="M 780 350 L 860 315" fill="none" stroke="#2b2f36" stroke-width="2"/>

  <!-- Note callout -->
  <rect x="60" y="540" width="720" height="90" rx="8" fill="#fff7ed" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="80" y="565" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#15202b">
    Why GPIO17, not GPIO27?
  </text>
  <text x="80" y="586" font-family="ui-monospace, monospace" font-size="12" fill="#3a4149">
    GPIO27 is not broken out on this board's header — neither is GPIO16 (likely reserved for the module's PSRAM).
  </text>
  <text x="80" y="605" font-family="ui-monospace, monospace" font-size="12" fill="#3a4149">
    Tying SD to 3.3V keeps the amp always enabled (simplest wiring). For a hardware mute later, wire SD to a spare
  </text>
  <text x="80" y="621" font-family="ui-monospace, monospace" font-size="12" fill="#3a4149">
    GPIO instead and drive it high just before playback.
  </text>
</svg>
