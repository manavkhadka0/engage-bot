## Base content is the image's own default etc/emqx.conf (node identity +
## dashboard listener) — required here, not schema-defaulted, per its own
## header: "Config precedence order: etc/base.hocon < cluster.hocon <
## emqx.conf < environment variables". Authentication/authorization below
## are Engage Bot's addition (Contract ④ — per-device serial+token, not a
## shared key).

node {
  name = "emqx@127.0.0.1"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
    listeners {
        http.bind = 18083
        https {
            ssl_options {
                certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
                keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
            }
        }
    }
}

# The auth/acl URLs below (http://host.docker.internal:3000) are for local
# docker-compose, where the backend runs on the host, not in this compose
# file. EMQX does not substitute arbitrary ${ENV_VARS} from OS environment
# into config file values (only the request-time placeholders below —
# ${username}/${password}/etc — are substituted, by the http auth plugin
# itself). In Coolify, replace both URLs with http://api:3000 (the backend
# service name in the same project network) — see team/COOLIFY_DEPLOY.md.
authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://host.docker.internal:3000/mqtt/auth"
    headers { "content-type" = "application/json" }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    pool_size = 8
    connect_timeout = 5s
    request_timeout = 5s
  }
]

authorization {
  sources = [
    {
      type = http
      method = post
      url = "http://host.docker.internal:3000/mqtt/acl"
      headers { "content-type" = "application/json" }
      body {
        username = "${username}"
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
      }
      pool_size = 8
      connect_timeout = 5s
      request_timeout = 5s
    }
  ]
  no_match = deny
  cache = { enable = true }
}
