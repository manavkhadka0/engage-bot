## Same as emqx.conf, but for when the backend runs as a container named
## `api` in the same compose project / Coolify project network (used by the
## root docker-compose.prod.yml, in production and in the local rehearsal).
## emqx.conf is the variant for a backend running directly on the host
## (pnpm start:dev).
##
## No secrets live in this file: the node cookie and the dashboard password come
## from the EMQX_NODE__COOKIE / EMQX_DASHBOARD__DEFAULT_PASSWORD environment
## variables (generated per machine in dev, by Coolify in production).
##
## EMQX imports authentication/authorization from this file only on the
## FIRST boot of its data volume. If you switch between emqx.conf and this
## file (or change the URLs), delete the emqx data volume first.

node {
  name = "emqx@127.0.0.1"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
    listeners {
        http.bind = 18083
        https {
            ssl_options {
                certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
                keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
            }
        }
    }
}

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://api:3000/mqtt/auth"
    headers { "content-type" = "application/json" }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    pool_size = 8
    connect_timeout = 5s
    request_timeout = 5s
  }
]

authorization {
  sources = [
    {
      type = http
      method = post
      url = "http://api:3000/mqtt/acl"
      headers { "content-type" = "application/json" }
      body {
        username = "${username}"
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
      }
      pool_size = 8
      connect_timeout = 5s
      request_timeout = 5s
    }
  ]
  no_match = deny
  cache = { enable = true }
}
